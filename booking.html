        font-family: Arial;

        margin: 20px;

    .menu a {
        color: white;
        text-decoration: none;

    }
    </style>
</head>

<body>

    <div class="menu">
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="packages.html">Tour Packages</a>
        <a href="rental.html">Taxi & Bike Rentals</a>
        <a href="contact.html">Contact Us</a>
    </div>

    <hr>

    <h1>Booking Enquiry</h1>

    <p>Please fill in your details for booking enquiries.</p>

    <hr>

    <form onsubmit="return checkForm()">

        <label>Enter Your Name:</label>
        <input type="text" id="customerName"
               name="customerName" required>
        <br><br>

        <label>Enter Phone Number:</label>
        <input type="tel" id="phone" name="phone" maxlength="10" 
               required>
        <br><br>

        <label>Enter Destination:</label>
        <input type="text" id="destination"
               name="destination" required>
        <br><br>

        <label>Select Services:</label>
        <select id="service" name="service" required onchange="showService()">
            <option value="" selected disabled>
                Select Services
            </option>
            <option value="Tour Package">Tour Package</option>
            <option value="Taxi Service">Taxi Service</option>
            <option value="Bike Rental">Bike Rental</option>
        </select>
        <br><br>

        <label>Travel Date:</label>
        <input type="date" id="travelDate"
               name="travelDate" required>
        <br><br>

        <label>Additional Details:</label>
        <br>
        <textarea id="details" name="details"
                  rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit Enquiry">

    </form>

    <script type="text/javascript">

        // Set today's date as the earliest travel date
        var today = new Date();

        var year = today.getFullYear();
        var month = today.getMonth() + 1;
        var day = today.getDate();

        if (month < 10) {
            month = "0" + month;
        }

        if (day < 10) {
            day = "0" + day;
        }

        var currentDate = year + "-" + month + "-" + day;

        document.getElementById("travelDate").min = currentDate;


        // Function to check the booking form
        function checkForm() {

            var name = document.getElementById("customerName").value.trim();
            var phone = document.getElementById("phone").value.trim();
            var destination = document.getElementById("destination").value.trim();
            var service = document.getElementById("service").value;
            var travelDate = document.getElementById("travelDate").value;

            // Check name
            if (name == "") {
                alert("Please enter your name!");
                return false;
            }

            // Check phone number
            if (!/^[0-9]{10}$/.test(phone)) {
                alert("Please enter a valid 10-digit phone number!");
                return false;
            }

            // Check destination
            if (destination == "") {
                alert("Please enter your destination!");
                return false;
            }

            // Check selected service
            if (service == "") {
                alert("Please select a service!");
                return false;
            }

            // Check travel date
            if (travelDate == "") {
                alert("Please select your travel date!");
                return false;
            }

            // Show success message
            alert("Your enquiry has been checked successfully!");

            // Stop actual form submission
            return false;
        }
        function showService()
        {
            var service= document.getElementById("service").value;
            alert("you selectd: "+ service)
        }

    </script>

    <hr>

    <p>For pricing and booking confirmation, please contact us.</p>

    <p>Phone: <a href="tel:9876543210">9876543210</a></p>

    <a href="index.html">Back to Home</a>

</body>
